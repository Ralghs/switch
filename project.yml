name: Switch
options:
  bundleIdPrefix: com.ralghs
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Automatic
schemes:
  SwitchDirect:
    build:
      targets:
        SwitchDirect: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  Switch:
    type: application
    platform: macOS
    sources:
      - path: Switch
        excludes:
          - Info.plist
          - Switch.entitlements
    resources:
      - Switch/Assets.xcassets
      - Switch/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralghs.switch
        PRODUCT_NAME: Switch
        INFOPLIST_FILE: Switch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Switch/Switch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - SwitchTests
  SwitchDirect:
    type: application
    platform: macOS
    sources:
      - path: Switch
        excludes:
          - Info.plist
          - Switch.entitlements
    resources:
      - Switch/Assets.xcassets
      - Switch/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralghs.switch
        PRODUCT_NAME: Switch
        INFOPLIST_FILE: Switch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
  SwitchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SwitchTests
    dependencies:
      - target: Switch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralghs.switch.tests
